name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  PI_GEN: arm64
  INIT_FORMAT: cloudinit-rpi
  COUNTRY: AU
jobs:
  image:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go test ./...
      - name: build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o image/stage-island/00-island/files/island ./island
      - name: password
        id: pw
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "pw=$PW" >> "$GITHUB_OUTPUT"
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: island
          pi-gen-version: ${{ env.PI_GEN }}
          stage-list: stage0 stage1 stage2 ./kit/image/stage-island
          hostname: island
          username: island
          password: ${{ steps.pw.outputs.pw }}
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          wpa-country: ${{ env.COUNTRY }}
          locale: en_GB.UTF-8
          timezone: Etc/UTC
          compression: xz
          compression-level: 6
          export-last-stage-only: true
          verbose-output: true
      - name: list
        run: |
          IMG="island-${GITHUB_REF_NAME}.img.xz"
          sudo cp "${{ steps.build.outputs.image-path }}" "$IMG"
          sudo chown "$USER" "$IMG"
          python3 image/os-list.py "$IMG" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > os-list.json
          cat os-list.json
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kit/${{ env.IMG }}
            kit/os-list.json
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: island-image
          path: |
            kit/${{ env.IMG }}
            kit/os-list.json
          retention-days: 7

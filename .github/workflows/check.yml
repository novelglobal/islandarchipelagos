name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: the island answers as spec/connection.md says
        run: |
          go build -o /tmp/island ./island
          mkdir -p /tmp/isle/dry
          ISLAND_LISTEN=127.0.0.1:8798 ISLAND_DRY_DIR=/tmp/isle/dry ISLAND_SHELF=/tmp/isle/shelf /tmp/island -config /tmp/isle/c.json -demo island &
          sleep 2
          node ../spec/tools/island-check.mjs http://127.0.0.1:8798 --print
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o island-arm64 ./island
      - uses: actions/upload-artifact@v4
        with:
          name: island-arm64
          path: kit/island-arm64
          retention-days: 7
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go vet ./...
      - run: go test ./...
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:api
  spec:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

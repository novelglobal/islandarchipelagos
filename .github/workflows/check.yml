name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o island-arm64 ./island
      - uses: actions/upload-artifact@v4
        with:
          name: island-arm64
          path: kit/island-arm64
          retention-days: 7
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go vet ./...
      - run: go test ./...
  spec:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

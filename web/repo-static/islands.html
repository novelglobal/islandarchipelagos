<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>Islands · novel.global</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --ink: #161514; --paper: #F3F2EE; --wall: #E4E2DC; --line: rgba(22, 21, 20, .2); --dim: rgba(22, 21, 20, .6); --on: #2FBF55; --sun: #E25C40; }
  @media (prefers-color-scheme: dark) { :root { --ink: #F1EFEA; --paper: #3B3736; --wall: #121212; --line: rgba(241, 239, 234, .22); --dim: rgba(241, 239, 234, .62); } }
  * { box-sizing: border-box; }
  html { background: var(--wall); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 400 14px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  a { color: inherit; text-underline-offset: .2em; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 16px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  header a { font-size: 12px; }
  #near { font: inherit; font-size: 12px; font-weight: 700; color: var(--paper); background: var(--ink); border: 0; border-radius: 2px; padding: 9px 14px; cursor: pointer; }
  #say { margin: 10px 2px 0; min-height: 17px; font-size: 12px; color: var(--dim); }
  ol { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
  li { background: var(--paper); padding: 16px 16px 14px; box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 10px 22px -16px rgba(0, 0, 0, .5); }
  li h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .st { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 3px; font-size: 12px; color: var(--dim); }
  .st i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: transparent; border: 1.5px solid currentColor; margin-right: 6px; vertical-align: 0; }
  .st .y i { background: var(--on); border-color: var(--on); }
  .st .y { color: var(--ink); }
  .pic { display: block; width: 100%; max-height: 240px; object-fit: contain; margin: 12px 0 0; background: rgba(0, 0, 0, .05); }
  .ad { margin: 12px 0 0; font-size: 14px; } .wd { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
  .go { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; }
  .way { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .way svg { width: 22px; height: 22px; fill: none; stroke: var(--sun); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
  .no { margin: 30px 2px; color: var(--dim); }
</style></head>
<body><main>
  <header><h1>Islands</h1><a href="/">novel.global</a></header>
  <button type="button" id="near" title="Show how far each open island is, and which way">Near me</button>
  <p id="say" aria-live="polite"></p>
  <ol id="list"></ol>
  <p class="no" id="none" hidden>None yet.</p>
</main>
<script src="islands.js"></script>
</body></html>

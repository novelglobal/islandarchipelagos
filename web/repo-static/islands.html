<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>Islands · novel.global</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --ink: #161514; --paper: #F3F2EE; --wall: #E9E7E1; --row: #F3F2EE; --line: rgba(22, 21, 20, .14); --dim: rgba(22, 21, 20, .56); --faint: rgba(22, 21, 20, .22); --on: #2FBF55; --sun: #F26A21; --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root:not(.day) { --ink: #F1EFEA; --paper: #1C1B1A; --wall: #121212; --row: #1C1B1A; --line: rgba(241, 239, 234, .12); --dim: rgba(241, 239, 234, .58); --faint: rgba(241, 239, 234, .22); } }
  :root.night { --ink: #F1EFEA; --paper: #1C1B1A; --wall: #121212; --row: #1C1B1A; --line: rgba(241, 239, 234, .12); --dim: rgba(241, 239, 234, .58); --faint: rgba(241, 239, 234, .22); }
  * { box-sizing: border-box; }
  html { background: var(--wall); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 400 14px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  a { color: inherit; } button { font: inherit; color: inherit; }

  /* the strip: back, the name, and always the state: live, how many on and open */
  .bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .bk { appearance: none; border: 0; background: none; width: 36px; height: 36px; margin-left: -8px; display: grid; place-items: center; cursor: pointer; text-decoration: none; }
  .bk svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
  h1 { margin: 0; display: flex; align-items: center; gap: 9px; font: 700 13px/1 var(--mono); letter-spacing: .16em; }
  h1 svg { width: 26px; height: 13px; } h1 .s { fill: var(--ink); } h1 .c { fill: none; stroke: var(--ink); stroke-width: 9; stroke-dasharray: 1 13; stroke-linecap: round; }
  .live { margin: 0 0 0 auto; display: flex; align-items: center; gap: 7px; font: 600 10px/1 var(--mono); letter-spacing: .1em; white-space: nowrap; }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--on); animation: pulse 2s ease-out infinite; flex: none; }
  .live.stale .dot { background: var(--faint); animation: none; } .live span { color: var(--dim); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47, 191, 85, .5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(47, 191, 85, 0); } }

  /* the dial: a radar. You at the middle, the islands as dots by their way and distance, the needle to the one picked */
  .scope { position: relative; width: min(100%, 300px, 42vh); margin: 6px auto 0; aspect-ratio: 1; }
  .scope svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .scope .rg { fill: none; stroke: var(--line); stroke-width: 1; } .scope .rg.d { stroke-dasharray: 1 5; stroke: var(--faint); }
  .scope .tk { stroke: var(--faint); stroke-width: 1.2; } .scope text { fill: var(--dim); font: 600 9px var(--mono); letter-spacing: .1em; }
  .scope .sw { transform-origin: 150px 150px; animation: sweep 8s linear infinite; } .scope .sw path { fill: url(#sw); }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .scope .rose { transform-origin: 150px 150px; transition: transform .35s ease-out; }
  .scope .isl { cursor: pointer; } .scope .isl circle { fill: var(--ink); } .scope .isl.shut circle { fill: var(--wall); stroke: var(--dim); stroke-width: 1.4; }
  .scope .isl .hit { fill: transparent !important; stroke: none !important; }
  .scope .isl.pick circle { fill: var(--sun); stroke: none; } .scope .isl .ring { fill: none !important; stroke: none !important; }
  .scope .isl.pick .ring { stroke: var(--sun) !important; stroke-width: 1.4; animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
  .scope .ndl { stroke: var(--sun); stroke-width: 2; stroke-linecap: square; transition: opacity .2s; } .scope .me { fill: var(--ink); }
  .scope.lost .ndl { opacity: 0; }
  .scope.here .me { fill: var(--sun); animation: ping 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .loc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); appearance: none; border: 0; padding: 9px 13px; background: var(--ink); color: var(--wall); font: 700 10.5px/1 var(--mono); letter-spacing: .14em; cursor: pointer; box-shadow: 3px 3px 0 var(--sun); }
  .loc:active { transform: translate(calc(-50% + 3px), calc(-50% + 3px)); box-shadow: none; }
  .read { margin: 8px 0 14px; min-height: 0; text-align: center; font: 700 22px/1.1 var(--mono); letter-spacing: .04em; font-variant-numeric: tabular-nums; } .read:empty { margin: 0 0 6px; }
  .read small { font-size: 11px; letter-spacing: .14em; color: var(--dim); margin-left: 6px; }
  .read.here { color: var(--sun); letter-spacing: .3em; } .read.dim { font-size: 11px; letter-spacing: .14em; color: var(--dim); padding-top: 7px; }

  /* the islands: number, name and place, how far, and one glance strip each (the same strip, in words, when picked) */
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  li { border-bottom: 1px solid var(--line); }
  li.pick { background: var(--row); border-bottom-color: var(--ink); }
  .row { width: 100%; appearance: none; border: 0; background: none; text-align: left; padding: 12px 2px; min-height: 58px; cursor: pointer; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 7px; align-items: center; }
  li.pick .row { padding-left: 10px; padding-right: 10px; }
  .row:focus-visible { outline: 2px solid var(--sun); outline-offset: -2px; }
  .n { grid-row: 1 / 3; align-self: start; padding-top: 2px; font: 600 11px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .nm { min-width: 0; } .nm b { display: block; font: 700 15px/1.15 'Helvetica Neue', Helvetica, Arial, sans-serif; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm span { display: block; margin-top: 3px; font: 500 10px/1.2 var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm span em { font-style: normal; color: var(--on); } li.shut .nm span em { color: var(--dim); } li.shut .nm b, li.shut .n { opacity: .55; }
  .d { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 4px; justify-self: end; }
  .d svg { width: 13px; height: 13px; fill: none; stroke: var(--sun); stroke-width: 2.6; stroke-linecap: square; transition: transform .3s; } .d i { font-style: normal; color: var(--faint); }
  li.flash { animation: flash 1.2s ease; } @keyframes flash { 0%, 30% { background: rgba(242, 106, 33, .16); } }
  .gl { grid-column: 2 / 4; display: flex; align-items: center; gap: 12px; font: 600 9.5px/1 var(--mono); letter-spacing: .1em; color: var(--dim); }
  .gl > span { display: inline-flex; align-items: center; gap: 5px; } .gl b { display: none; font-weight: 600; }
  li.pick .gl { flex-wrap: wrap; gap: 8px 14px; color: var(--ink); } li.pick .gl b { display: inline; }
  .gl svg { width: 13px; height: 13px; flex: none; }
  .pw { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); } .y > .pw { background: var(--on); border-color: var(--on); }
  .pp rect { fill: none; stroke: currentColor; stroke-width: 1.6; } .pp .f { fill: currentColor; stroke: none; } .gl .no { color: var(--sun); } .gl .x { opacity: .4; }
  .wf rect { fill: var(--faint); } .wf rect.y { fill: currentColor; }
  .ms path, .ms circle { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .q { font-variant-numeric: tabular-nums; }

  /* picked: its art, how to find it, its words, then MAP and ISLAND (go to it) */
  .more { padding: 0 10px 14px 44px; }
  .pic { display: block; width: 100%; max-height: 300px; object-fit: contain; margin: 2px 0 12px; background: rgba(128, 128, 128, .08); }
  .fd { margin: 0; font: 700 15px/1.3 'Helvetica Neue', Helvetica, Arial, sans-serif; } .fd::before { content: '→ '; color: var(--sun); }
  .ad { margin: 6px 0 0; font: 500 11px/1.4 var(--mono); letter-spacing: .04em; color: var(--dim); } .wd { margin: 6px 0 0; font-size: 13px; }
  .acts { display: flex; gap: 8px; margin-top: 14px; }
  .acts a, .acts button { appearance: none; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 12px; border: 1.5px solid var(--ink); background: none; font: 700 11px/1 var(--mono); letter-spacing: .14em; text-decoration: none; cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .acts .go { background: var(--sun); border-color: var(--sun); color: #121212; box-shadow: 3px 3px 0 var(--ink); } .acts .go:active { transform: translate(3px, 3px); box-shadow: none; }
  .acts .isl { background: var(--ink); color: var(--wall); border-color: var(--ink); } .acts .isl:hover svg { transform: translateX(3px); } .acts .isl svg { transition: transform .2s; }
  .acts [aria-disabled="true"] { opacity: .3; pointer-events: none; box-shadow: none; }
  .acts svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
  .all { appearance: none; display: block; margin: 12px auto 0; padding: 8px 14px; border: 1px solid var(--line); background: none; font: 600 10px/1 var(--mono); letter-spacing: .14em; color: var(--dim); cursor: pointer; }
  .none { margin: 30px 2px; text-align: center; font: 600 11px/1.4 var(--mono); letter-spacing: .1em; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .live .dot, li.flash, .scope .sw, .scope .isl.pick .ring, .scope.here .me { animation: none; } }
</style></head>
<body><main>
  <div class="bar">
    <a class="bk" id="bk" href="/" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1><svg viewBox="0 0 237 112" aria-hidden="true"><rect class="s" x="10" y="10" width="92" height="92"/><circle class="c" cx="178" cy="56" r="46"/></svg>ISLANDS</h1>
    <p class="live stale" id="live" aria-live="polite"><i class="dot" aria-hidden="true"></i><span id="tally"></span></p>
  </div>
  <div class="scope lost" id="scope">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F26A21" stop-opacity="0"/><stop offset="1" stop-color="#F26A21" stop-opacity=".16"/></linearGradient></defs>
      <g class="sw"><path d="M150 150L150 8A142 142 0 0 1 250.4 49.6Z"/></g>
      <g class="rose" id="rose">
        <circle class="rg" cx="150" cy="150" r="142"/><circle class="rg d" cx="150" cy="150" r="100"/><circle class="rg d" cx="150" cy="150" r="58"/>
        <path class="tk" d="M150 2v14M150 284v14M2 150h14M284 150h14"/><text x="150" y="30" text-anchor="middle">N</text>
        <line class="ndl" id="ndl" x1="150" y1="150" x2="150" y2="150"/>
        <g id="dots"></g>
      </g>
      <circle class="me" cx="150" cy="150" r="4"/>
    </svg>
    <button type="button" class="loc" id="loc" title="Where you stand, to point the way: it never leaves this phone">LOCATE</button>
  </div>
  <p class="read" id="read" aria-live="polite"></p>
  <ol id="list"></ol>
  <button type="button" class="all" id="all" hidden>ALL</button>
  <p class="none" id="none" hidden>NONE YET</p>
</main>
<script src="islands.js"></script>
</body></html>

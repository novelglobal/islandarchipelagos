<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>Islands · novel.global</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --ink: #161514; --paper: #F3F2EE; --wall: #E4E2DC; --row: #EDEBE6; --line: rgba(22, 21, 20, .14); --dim: rgba(22, 21, 20, .56); --faint: rgba(22, 21, 20, .22); --on: #2FBF55; --sun: #E25C40; --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root { --ink: #F1EFEA; --paper: #1C1B1A; --wall: #121212; --row: #232120; --line: rgba(241, 239, 234, .12); --dim: rgba(241, 239, 234, .58); --faint: rgba(241, 239, 234, .22); } }
  * { box-sizing: border-box; }
  html { background: var(--wall); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 400 14px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); letter-spacing: .08em; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  h1 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--mono); letter-spacing: .16em; }
  h1 svg { width: 30px; height: 15px; }
  h1 svg .s { fill: var(--ink); } h1 svg .c { fill: none; stroke: var(--ink); stroke-width: 9; }
  header a { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-decoration: none; padding: 10px 2px; opacity: .7; } header a:hover { opacity: 1; }

  /* the strip: live, how many on, how many open, and the sort */
  .bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 -16px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top) * 0); background: var(--wall); border-bottom: 1px solid var(--line); }
  .live { display: flex; align-items: center; gap: 10px; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; white-space: nowrap; overflow: hidden; }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--on); box-shadow: 0 0 0 0 rgba(47, 191, 85, .5); animation: pulse 2s ease-out infinite; flex: none; }
  .live.stale .dot { background: var(--faint); animation: none; }
  .live b { font-weight: 700; } .live span { color: var(--dim); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(47, 191, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(47, 191, 85, 0); } }
  .seg { display: flex; flex: none; border: 1px solid var(--ink); }
  .seg button { appearance: none; border: 0; background: none; padding: 7px 10px; min-width: 40px; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
  #say { margin: 8px 2px 0; min-height: 15px; font: 500 10.5px/1.4 var(--mono); letter-spacing: .06em; color: var(--dim); }
  #home { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 0; padding: 10px 12px; background: var(--ink); color: var(--wall); font: 600 11px/1.2 var(--mono); letter-spacing: .1em; }
  #home button { appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 6px 4px; cursor: pointer; opacity: .75; } #home button:hover { opacity: 1; }

  /* the columns: number, island and place, how far, and the intel */
  .head, .row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 62px 86px; align-items: center; column-gap: 8px; }
  .head { margin-top: 12px; padding: 0 12px 6px; font: 600 9px/1 var(--mono); letter-spacing: .12em; color: var(--dim); }
  .head .r, .row .d { text-align: right; }
  .head .in { display: flex; justify-content: flex-end; gap: 4px; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); background: var(--row); }
  li.shut { background: transparent; }
  li.shut .row .n, li.shut .row .nm, li.shut .row .d { opacity: .55; }
  .row { width: 100%; appearance: none; border: 0; background: none; text-align: left; padding: 12px; min-height: 58px; cursor: pointer; }
  .row:hover { background: rgba(128, 128, 128, .07); }
  .row:focus-visible { outline: 2px solid var(--sun); outline-offset: -2px; }
  .row .n { font: 600 12px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .nm { min-width: 0; }
  .row .nm b { display: block; font: 700 14px/1.2 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
  .row .nm span { display: block; margin-top: 3px; font: 500 10px/1.2 var(--mono); letter-spacing: .08em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
  .row .nm span em { font-style: normal; color: var(--on); } li.shut .row .nm span em { color: var(--dim); }
  .row .d { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .row .d svg { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--sun); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
  .row .d i { font-style: normal; color: var(--faint); }
  li.flash { animation: flash 1.2s ease; } @keyframes flash { 0%, 30% { background: rgba(226, 92, 64, .16); } }

  /* the intel: power, paper, Wi-Fi, radio, queue, each one glyph wide */
  .in { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .in > * { flex: none; width: 13px; display: grid; place-items: center; }
  .in .q { width: 18px; font: 600 11px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; place-items: center end; }
  .in svg { width: 13px; height: 13px; }
  .pw { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); margin: 0 2.5px; } .pw.y { background: var(--on); border-color: var(--on); }
  .pp rect { fill: none; stroke: currentColor; stroke-width: 1.6; } .pp .f { fill: currentColor; stroke: none; } .pp.no { color: var(--sun); } .pp.un { color: var(--faint); }
  .wf rect { fill: var(--faint); } .wf rect.y { fill: var(--ink); }
  .rd path, .rd circle { fill: none; stroke: var(--faint); stroke-width: 1.7; stroke-linecap: round; } .rd.y path, .rd.y circle { stroke: var(--ink); }
  .q.z { color: var(--faint); }

  /* an island opened: its picture, its words, and what to do there */
  .more { padding: 0 12px 14px 46px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chips span { padding: 4px 7px; border: 1px solid var(--line); font: 600 9.5px/1 var(--mono); letter-spacing: .1em; color: var(--dim); }
  .chips span.y { color: var(--ink); border-color: var(--ink); } .chips span.no { color: var(--sun); border-color: var(--sun); }
  .pic { display: block; width: 100%; max-height: 260px; object-fit: contain; margin: 0 0 12px; background: rgba(0, 0, 0, .05); }
  .ad { margin: 0; font-size: 14px; } .wd { margin: 4px 0 0; font-size: 13px; color: var(--dim); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .acts a, .acts button { appearance: none; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border: 1px solid var(--ink); background: none; font: 600 11px/1 var(--mono); letter-spacing: .12em; text-decoration: none; cursor: pointer; }
  .acts .go { background: var(--ink); color: var(--wall); }
  .acts .go:hover, .acts button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: #fff; }
  .acts [aria-disabled="true"] { opacity: .35; pointer-events: none; }
  .acts svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .no { margin: 30px 2px; font: 600 11px/1.4 var(--mono); letter-spacing: .1em; color: var(--dim); }
  .key { margin: 18px 2px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 9.5px/1 var(--mono); letter-spacing: .1em; color: var(--dim); }
  .key span { display: inline-flex; align-items: center; gap: 5px; } .key .in > * { width: auto; }

  @media (max-width: 360px) { .head, .row { grid-template-columns: 20px minmax(0, 1fr) 54px 80px; column-gap: 6px; } .row, .head { padding-left: 8px; padding-right: 8px; } .more { padding-left: 34px; padding-right: 8px; } .in { gap: 3px; } }
  @media (min-width: 640px) { .head, .row { grid-template-columns: 34px minmax(0, 1fr) 90px 104px; column-gap: 14px; } .in { gap: 7px; } .row .nm b { font-size: 15px; } .more { padding-left: 60px; } }
  @media (prefers-reduced-motion: reduce) { .live .dot, li.flash { animation: none; } }
</style></head>
<body><main>
  <header><h1><svg viewBox="0 0 237 112" aria-hidden="true"><rect class="s" x="10" y="10" width="92" height="92"/><circle class="c" cx="178" cy="56" r="46"/></svg>ISLANDS</h1><a href="/" title="Back to novel.global">NOVEL.GLOBAL</a></header>
  <div class="bar">
    <p class="live stale" id="live" aria-live="polite"><i class="dot" aria-hidden="true"></i><b>LIVE</b><span id="tally"></span></p>
    <div class="seg" role="group" aria-label="Sort">
      <button type="button" data-sort="n" title="By island number" aria-pressed="true">#</button>
      <button type="button" data-sort="near" title="Nearest first: asks this phone where it is, which never leaves it" aria-pressed="false">NEAR</button>
      <button type="button" data-sort="on" title="On and open first" aria-pressed="false">ON</button>
    </div>
  </div>
  <p id="say" aria-live="polite"></p>
  <div id="home" hidden><span id="homet"></span><button type="button" id="unhome" title="novel.global as it comes">RESET</button></div>
  <div class="head" aria-hidden="true"><span>#</span><span>ISLAND</span><span class="r">DIST</span><span class="r">STATUS</span></div>
  <ol id="list"></ol>
  <p class="no" id="none" hidden>NONE YET</p>
  <div class="key" aria-label="Key">
    <span><i class="pw y" aria-hidden="true"></i>ON</span>
    <span><svg class="pp" viewBox="0 0 14 14" width="13" height="13" aria-hidden="true"><rect x="3" y="1.5" width="8" height="11" rx="1"/><rect class="f" x="5" y="4" width="4" height="6"/></svg>PAPER</span>
    <span><svg class="wf" viewBox="0 0 14 14" width="13" height="13" aria-hidden="true"><rect class="y" x="1" y="9" width="3" height="4"/><rect class="y" x="5.5" y="5.5" width="3" height="7.5"/><rect class="y" x="10" y="2" width="3" height="11"/></svg>WI-FI</span>
    <span><svg class="rd y" viewBox="0 0 14 14" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="1.4"/><path d="M4 4a4.3 4.3 0 0 0 0 6M10 4a4.3 4.3 0 0 1 0 6M2 2a7.2 7.2 0 0 0 0 10M12 2a7.2 7.2 0 0 1 0 10"/></svg>RADIO</span>
    <span><b class="mono" aria-hidden="true">3</b>QUEUE</span>
  </div>
</main>
<script src="islands.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>novel.global</title>
<style>
  @font-face { font-family: 'VT323'; font-weight: 400; src: url(vendor/fonts/vt323-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(vendor/fonts/poppins-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(vendor/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
  :root { --ink: #111; --paper: #f2f1ec; --line: #111; --dim: rgba(17, 17, 17, .45); --on: #2fbf55; --bg: #d9d8d2; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --paper: #161718; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); --bg: #0c0d0e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 500 12px/1.3 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  main { max-width: 420px; margin: 0 auto; padding: 16px; }
  .win { background: var(--paper); border: 1px solid var(--line); }
  .win > header { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--ink); color: var(--paper); }
  .win > header b { flex: 1; } .win > header a { color: inherit; text-decoration: none; }
  form { display: flex; gap: 8px; padding: 16px; }
  input { flex: 1; min-width: 0; font: 400 44px/1 VT323, ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 6px 10px; }
  button { font: inherit; letter-spacing: inherit; color: var(--paper); background: var(--ink); border: 1px solid var(--line); border-radius: 0; padding: 10px 14px; min-height: 40px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  #out { padding: 0 16px 16px; text-align: center; }
  #out:empty { display: none; }
  .mk { font: 120px/1.1 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .w { font: 700 26px/1.1 Poppins, Arial, sans-serif; margin: 4px 0 2px; }
  .say { color: var(--dim); margin: 10px 0; }
  #out button { width: 100%; min-height: 52px; font-size: 14px; }
  #ask { border-top: 1px dashed var(--line); padding: 12px 16px 16px; }
  #ask p { margin: 0 0 10px; color: var(--dim); }
  #isl { display: flex; flex-wrap: wrap; gap: 8px; }
  #isl button { background: transparent; color: var(--ink); min-height: 36px; padding: 8px 10px; font-size: 11px; }
  #isl i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; display: inline-block; margin-right: 6px; }
  #isl i.on { background: var(--on); border-color: var(--on); }
  #say { margin: 10px 0 0; } #say:empty { display: none; }
</style></head>
<body><main><section class="win"><header><b>CODE</b><a href="/">novel.global</a></header>
<form id="f" autocomplete="off"><input id="c" maxlength="8" spellcheck="false" autocapitalize="characters" aria-label="Code" placeholder="···"><button>OPEN</button></form>
<div id="out" aria-live="polite"></div>
<div id="ask" hidden><p>NO PASS AT THE PRINTER? ASK IT FOR ONE</p><div id="isl"></div><p id="say" aria-live="polite"></p></div></section></main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); }, out = $('#out'), inp = $('#c');
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); };
  var day = function () { try { return new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Melbourne' }); } catch (e) { return new Date().toISOString().slice(0, 10); } };
  function pass(j) {
    out.innerHTML = '<div class="mk" aria-hidden="true">' + esc(j.mark.e) + '</div><p class="w">' + esc(j.mark.w) + '</p><p>' + esc(String(j.name).toUpperCase()) + (j.number ? ' · ' + esc(j.number) : '') + '</p>' +
      (j.used ? '<p class="say">THIS PASS IS USED</p>' : '<p class="say">ONE PRINT TODAY, STRAIGHT OUT</p><button id="keep">KEEP IT</button>');
    var k = $('#keep'); if (k) k.addEventListener('click', function () { try { localStorage.setItem('da.pass', JSON.stringify({ code: j.code, island: j.island, day: day() })); } catch (e) { /* none */ }
      k.disabled = true; k.textContent = 'KEPT · PRINT AWAY'; setTimeout(function () { location.href = '/'; }, 1400); });
  }
  function open(c) {
    c = String(c || '').toUpperCase().replace(/[^A-Z0-9-]/g, ''); if (!c) return; inp.value = c; out.innerHTML = '<p class="say">· · ·</p>';
    fetch('/api/c/' + encodeURIComponent(c)).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
      if (!x.ok) { out.innerHTML = '<p class="say">' + (/island/.test(x.j.error || '') ? 'TYPE IT ON THE ISLAND' : /many/.test(x.j.error || '') ? 'TRY AGAIN SOON' : 'NO SUCH CODE') + '</p>'; return; }
      if (x.j.kind === 'pass') return pass(x.j);
      if (x.j.go) location.href = x.j.go;
    }, function () { out.innerHTML = '<p class="say">NOT REACHED</p>'; });
  }
  fetch('/api/partners').then(function (r) { return r.ok ? r.json() : { partners: [] }; }).then(function (j) {
    var l = (j.partners || []).filter(function (p) { return p.paired || p.id === 'novelglobal'; }); if (!l.length) return;
    $('#isl').innerHTML = l.map(function (p) { return '<button type="button" data-i="' + esc(p.id) + '"><i class="' + (p.ready ? 'on' : '') + '"></i>' + esc(String(p.name || p.id).toUpperCase()) + '</button>'; }).join(''); $('#ask').hidden = false;
  }).catch(function () {});
  $('#isl').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var say = $('#say'); b.disabled = true; say.textContent = '· · ·';
    fetch('/api/c', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ask: b.dataset.i }) }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
      var n = String((x.j && x.j.name) || b.textContent).toUpperCase();
      say.textContent = x.ok ? (x.j.ready ? 'PRINTING AT ' + n + ' · TAKE IT FROM THE PRINTER' : 'IT PRINTS WHEN ' + n + ' WAKES') : /just/.test(x.j.error || '') ? 'ONE WAS JUST PRINTED THERE · LOOK BY THE PRINTER' : /many/.test(x.j.error || '') ? 'TRY AGAIN SOON' : 'NOT SENT';
    }, function () { say.textContent = 'NOT REACHED'; }).then(function () { setTimeout(function () { b.disabled = false; }, 4000); }); });
  $('#f').addEventListener('submit', function (e) { e.preventDefault(); open(inp.value); });
  var h = decodeURIComponent(location.hash.slice(1)); if (h) open(h); else inp.focus();
})();
</script></body></html>

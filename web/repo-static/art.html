<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>novel.global</title>
<style>
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(vendor/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url(vendor/fonts/poppins-latin-600-normal.woff2) format('woff2'); }
  :root { --ink: #111; --paper: #F2F1EC; --bg: #E7E5E1; --dim: rgba(17, 17, 17, .5); --hot: #FF5436; }
  .dk { --ink: #ECEBE6; --paper: #121417; --bg: #0B0C0E; --dim: rgba(236, 235, 230, .5); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 500 11px/1.2 'IBM Plex Mono', ui-monospace, Menlo, monospace; letter-spacing: .08em; overflow: hidden; }
  .in, .in body { background: transparent; }
  #art { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 8px; }
  #top a { color: inherit; text-decoration: none; font: 600 15px/1 'Poppins', Arial, sans-serif; letter-spacing: -.01em; }
  .in #top a { visibility: hidden; }
  #kind { color: var(--dim); }
  #track { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  #track::-webkit-scrollbar { display: none; }
  #track.lock { overflow-x: hidden; touch-action: none; }
  .sl { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: center; padding: 6px 14px 10px; overflow: hidden; touch-action: pan-x; }
  .sl figure { margin: 0; width: 100%; height: 100%; display: grid; place-items: center; }
  .sl img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; user-select: none; -webkit-user-drag: none; transform-origin: 0 0; box-shadow: 0 18px 40px -26px rgba(0, 0, 0, .6); background: #fff; }
  .c-ink .sl img { filter: grayscale(1) contrast(1.25); }
  .c-blue .sl img { filter: url(#f-blue); }
  .c-tomato .sl img { filter: url(#f-tomato); }
  .c-lime .sl img { filter: url(#f-lime); }
  .c-night .sl img { filter: grayscale(1) invert(1) contrast(1.1); }
  #dots { display: flex; justify-content: center; gap: 5px; padding: 2px 0 8px; min-height: 14px; }
  #dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); opacity: .2; }
  #dots i.on { opacity: .85; }
  #keys { display: flex; justify-content: center; gap: 6px; padding: 0 12px calc(env(safe-area-inset-bottom) + 12px); flex-wrap: wrap; }
  #keys button { font: inherit; letter-spacing: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 999px; padding: 0 12px; min-height: 34px; min-width: 34px; cursor: pointer; }
  #keys button:disabled { opacity: .35; cursor: default; }
  #keys button.on { background: var(--ink); color: var(--paper); }
  #st { text-align: center; min-height: 1.2em; margin: 0 0 6px; color: var(--dim); }
  .none { margin: auto; color: var(--dim); }
</style>
<script src="art.js"></script></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="f-blue" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0.078 0.957"/><feFuncG type="table" tableValues="0.239 0.945"/><feFuncB type="table" tableValues="0.443 0.910"/></feComponentTransfer></filter>
  <filter id="f-tomato" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0.067 1"/><feFuncG type="table" tableValues="0.067 0.329"/><feFuncB type="table" tableValues="0.067 0.212"/></feComponentTransfer></filter>
  <filter id="f-lime" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0.078 0.851"/><feFuncG type="table" tableValues="0.239 0.949"/><feFuncB type="table" tableValues="0.443 0.290"/></feComponentTransfer></filter>
</svg>
<main id="art" aria-label="Art">
  <div id="top"><a href="/" title="Back to novel.global">novel.global</a><span id="kind"></span></div>
  <div id="track" tabindex="0"></div>
  <div id="dots" aria-hidden="true"></div>
  <p id="st" aria-live="polite"></p>
  <div id="keys">
    <button type="button" data-k="colour" title="Colour">COLOUR</button>
    <button type="button" data-k="remix" title="Remix it in the zine maker">REMIX</button>
    <button type="button" data-k="share" title="Share">SHARE</button>
    <button type="button" data-k="print" title="Print it at novel.global">PRINT</button>
  </div>
</main>
</body></html>

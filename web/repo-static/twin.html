<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0F0F0E">
<title>Twin</title>
<link rel="icon" href="icon.svg">
<style>
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(vendor/fonts/poppins-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(vendor/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(vendor/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }
  :root { --bg: #0F0F0E; --ink: #ECEAE4; --grey: #8C8980; --dim: #4A4843; --line: rgba(236, 234, 228, .13); --paper: #FAF9F4; --hot: #E2552E; --body: #252522; }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 500 13px/1.45 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .03em; }
  main { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  h1 { margin: 0; font: 700 22px/1.05 Poppins, sans-serif; letter-spacing: -.01em; text-transform: uppercase; overflow-wrap: anywhere; }
  h2 { margin: 0; font: 600 10px/1 'IBM Plex Mono', monospace; letter-spacing: .22em; color: var(--grey); }
  button, .k { font: 600 10.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; min-height: 32px; padding: 0 12px; cursor: pointer; touch-action: manipulation; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .k:hover { border-color: var(--grey); }
  button.on, button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  input { font: 500 15px/1.3 'IBM Plex Mono', monospace; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0; letter-spacing: .08em; }
  input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top .id { display: grid; gap: 4px; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font: 600 10px/1 'IBM Plex Mono', monospace; letter-spacing: .18em; color: var(--grey); white-space: nowrap; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .led.on { background: var(--ink); box-shadow: 0 0 8px rgba(236,234,228,.6); }
  .led.hot { background: var(--hot); box-shadow: 0 0 10px var(--hot); }
  /* the printer and its paper */
  .stage { position: relative; margin: 18px auto 0; width: min(100%, 380px); }
  .stage svg { display: block; width: 100%; height: auto; position: relative; z-index: 2; }
  #roll { position: relative; z-index: 1; width: 82%; margin: -6px auto 0; display: grid; gap: 0; }
  .slip { position: relative; overflow: hidden; background: var(--paper); box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45); transition: height .9s linear; }
  .slip canvas, .slip img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .slip + .slip { margin-top: 10px; }
  .slip::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(135deg, transparent 50%, var(--bg) 50%) 0 0 / 8px 6px repeat-x, linear-gradient(225deg, transparent 50%, var(--bg) 50%) 4px 0 / 8px 6px repeat-x; }
  .slip .tag { position: absolute; right: 6px; top: 6px; font: 600 9px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #fff; background: rgba(15,15,14,.78); padding: 4px 6px; border-radius: 3px; }
  .slip.radio { background: transparent; box-shadow: none; border: 1px dashed var(--line); padding: 10px 12px; color: var(--ink); font-size: 12px; }
  .slip.radio::after { display: none; }
  .empty { margin: 14px auto 0; text-align: center; color: var(--grey); font-size: 11px; letter-spacing: .18em; }
  /* the parts below: one line each, opened by a tap */
  .parts { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: rgba(255,255,255,.015); }
  details[open] { padding-bottom: 14px; }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; }
  summary::-webkit-details-marker { display: none; }
  summary b { font: 600 11px/1 'IBM Plex Mono', monospace; letter-spacing: .2em; }
  summary span { color: var(--grey); font-size: 10.5px; letter-spacing: .12em; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map { display: block; width: 100%; height: auto; margin: 2px 0 12px; }
  .map text { font: 600 10px 'IBM Plex Mono', monospace; letter-spacing: .14em; fill: var(--ink); }
  .map .sub { fill: var(--grey); font-size: 8.5px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .opts button { min-height: 30px; }
  .opts .gh { border-style: dashed; }
  .lbl { display: block; margin-top: 14px; font: 600 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .2em; color: var(--grey); }
  .say { margin: 10px 0 0; color: var(--grey); font-size: 11px; letter-spacing: .1em; min-height: 1em; }
  .log { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 11.5px; overflow-wrap: anywhere; }
  .log li i { font-style: normal; color: var(--grey); }
  /* the gate: no key on this phone */
  #gate { padding-top: 12vh; display: grid; gap: 18px; }
  #gate h1 { font-size: 44px; }
  #gate form { display: flex; gap: 8px; } #gate input { flex: 1; }
  #gate .alt { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
  /* the bench: each part drawn by hand, its ports below it; tap a port, then another, for a cable */
  .bench { display: block; width: 100%; height: auto; margin: 4px 0 6px; color: var(--ink); overflow: visible; }
  .bench path { fill: none; }
  .bench .pt { color: var(--ink); transition: opacity .3s; } .bench .pt.off { opacity: .42; }
  .bench .ac { color: var(--hot); }
  .bench .bk { fill: var(--bg); }
  .bench text { font: 600 8.5px 'IBM Plex Mono', monospace; letter-spacing: .12em; fill: var(--ink); }
  .bench .pl { font-size: 7.5px; fill: var(--grey); letter-spacing: .06em; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .bench .po { cursor: pointer; outline: none; } .bench .po circle { fill: var(--bg); stroke: var(--ink); stroke-width: 1.3; } .bench .po circle.ph { fill: transparent !important; stroke: none !important; }
  .bench .po.fit circle:not(.ph) { stroke: var(--hot); stroke-width: 2; stroke-dasharray: 2 2; animation: fit 1.2s ease-in-out infinite alternate; } @keyframes fit { to { stroke-dashoffset: 4; } }
  .bench .po:hover circle, .bench .po:focus-visible circle { stroke: var(--hot); } .bench .po.sel circle { fill: var(--hot); stroke: var(--hot); } .bench .po.used circle { fill: var(--ink); }
  .bench .cb { stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; } .bench .cb.bad { stroke: var(--hot); opacity: .45; stroke-dasharray: 2 4; }
  .bench .cb.dat { stroke-width: 1.1; } .bench .cb.pwr { stroke: var(--dim); } .bench .cb.pwr.on { stroke: var(--ink); stroke-dasharray: 5 4; animation: flow .9s linear infinite; } @keyframes flow { to { stroke-dashoffset: -9; } }
  .bench .sdf { fill: var(--hot); opacity: .55; } .bench .sdf.v { opacity: 1; }
  #fls .dn::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .bench .hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
  .pw { margin: 0; font: 600 11px/1 'IBM Plex Mono', monospace; letter-spacing: .2em; } .pw.short { color: var(--hot); }
  .more { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 4px; } .why { color: var(--ink); margin-top: 6px; letter-spacing: .04em; line-height: 1.5; } .why:empty { display: none; }
  /* the build: what the island wants next is drawn where it goes. A ghost of the part, or two ports breathing and a dotted cable */
  .bench .gh { cursor: pointer; color: var(--grey); opacity: .5; outline: none; animation: ghost 2.4s ease-in-out infinite alternate; } @keyframes ghost { to { opacity: .95; } }
  .bench .gh .bk { fill: transparent; pointer-events: all; stroke: var(--grey); stroke-dasharray: 4 4; } .bench .gh:hover .bk, .bench .gh:focus-visible .bk { stroke: var(--hot); }
  .bench .gp { font-size: 15px; fill: var(--hot); }
  .bench .po { touch-action: none; } .bench .po.want circle:not(.ph) { stroke: var(--hot); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: want .9s ease-in-out infinite alternate; } @keyframes want { to { transform: scale(1.45); } }
  .bench .cbg { stroke: var(--hot); stroke-width: 1.5; stroke-dasharray: 1 6; stroke-linecap: round; animation: flow 1.4s linear infinite; }
  .bench .cbd { stroke: var(--hot); stroke-width: 1.8; fill: none; pointer-events: none; }
  .bench [data-body] { cursor: pointer; outline: none; } .bench [data-body]:focus-visible .bk { stroke: var(--hot); }
  .bench .pt.want .bk { stroke: var(--hot); stroke-width: 1.6; animation: pulse 1.3s ease-in-out infinite alternate; } @keyframes pulse { to { stroke-opacity: .2; } }
  .bench .roll .rl0 { fill: none; stroke: var(--line); } .bench .roll .rl { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; transition: r .6s; } .bench .roll .rl.low { stroke: var(--hot); } .bench .roll .rc { fill: var(--ink); }
  .tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin: 2px 0 12px; } .tray[hidden] { display: none; }
  .tile { display: grid; justify-items: center; align-content: start; gap: 4px; padding: 8px 4px 6px; font: 600 8.5px/1.25 'IBM Plex Mono', monospace; letter-spacing: .1em; }
  .tile svg { width: 72px; height: 54px; color: var(--ink); } .tile svg path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; } .tile svg .ac { stroke: var(--hot); }
  .tile i { font-style: normal; font-size: 7px; color: var(--hot); letter-spacing: .16em; } .tile.on { border-color: var(--hot); } .tile.x { font-size: 20px; font-weight: 400; color: var(--grey); align-content: center; }
  .day { display: block; width: 100%; height: auto; margin: 0 0 8px; } .day[hidden] { display: none; }
  .day .sun { fill: none; stroke: var(--hot); stroke-width: 1.4; } .day .lv { fill: var(--ink); fill-opacity: .12; stroke: var(--ink); stroke-width: 1; } .day .nt { fill: var(--ink); opacity: .1; } .day .dk { stroke: var(--ink); stroke-width: 1.4; }
  /* the rite: five stations on the sun's path; the one Irukandji under it, waking as they light */
  .top .chip { border: 0; padding: 0; min-height: 0; background: none; color: var(--grey); } .top .chip:disabled { opacity: 1; cursor: default; } .top .chip.off .led { background: transparent; box-shadow: inset 0 0 0 1.4px var(--hot); }
  .rite { display: block; width: 100%; height: auto; margin: 14px 0 -4px; overflow: visible; }
  .rite .rp { fill: none; stroke: var(--line); stroke-width: 1; } .rite .rp.on { stroke: var(--ink); stroke-opacity: .5; }
  .rite .ik { transition: opacity 1.4s; } .rite .ik path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; } .rite .ik .tn { stroke-dasharray: .2 3.6; }
  .rite .ik.beat { animation: beat 1.05s ease-in-out infinite; } @keyframes beat { 45% { opacity: .95; } }
  .rite .ik.all .tn { animation: drift 5s ease-in-out infinite alternate; } @keyframes drift { to { stroke-dashoffset: 3.8; } }
  .rite .st { cursor: pointer; outline: none; } .rite .st .hb { fill: transparent; stroke: none; } .rite .st circle:not(.hb) { fill: var(--dim); transition: fill .5s; }
  .rite .st.lit circle:not(.hb) { fill: var(--ink); } .rite .st.lit .c { fill: var(--hot); } .rite .st.now circle:not(.hb) { fill: var(--grey); animation: wake 2.2s ease-in-out infinite alternate; } @keyframes wake { from { opacity: .3; } }
  .rite .rw { font: 600 8px 'IBM Plex Mono', monospace; letter-spacing: .32em; fill: var(--grey); }
  #pf button.want { border-color: var(--hot); animation: btn 1.1s ease-in-out infinite alternate; } @keyframes btn { to { border-color: var(--line); } } .dots { -webkit-text-security: disc; }
  .rite .st:hover .hb, .rite .st:focus-visible .hb { stroke: var(--line); stroke-width: 1; }
  .rite .st.seal { transform-box: fill-box; transform-origin: center; animation: seal .8s cubic-bezier(.2, 1.5, .4, 1) both; } @keyframes seal { from { transform: scale(2.4) rotate(-24deg); opacity: 0; } }
  /* the first start: its log, the last five lines */
  .boot { list-style: none; margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #0A0A09; font: 500 10px/1.65 'IBM Plex Mono', monospace; letter-spacing: .02em; color: var(--dim); cursor: pointer; }
  .boot li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .boot li.nw { color: var(--ink); animation: type .45s steps(24) both; } .boot li[data-err] { color: var(--hot); } @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
  .bench .leds .lp { fill: var(--hot); } .bench .leds .la { fill: var(--dim); } .bench .leds .la.run, .bench .leds .la.rd { animation: act .26s steps(2, jump-none) infinite; } .bench .leds .la.idle { animation: act 4.3s steps(9, jump-none) infinite; } @keyframes act { 50% { fill: var(--ink); } }
  .bench .cue { fill: none; stroke: var(--hot); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; animation: pulse 1.3s ease-in-out infinite alternate; }
  /* the imager, mimicked */
  #flp { margin-top: 10px; } #flp .row { justify-content: space-between; } #flp .say { margin: 0; }
  .bar { height: 6px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 10px; } .bar i { display: block; height: 100%; background: var(--ink); transition: width .1s linear; }
  .flf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; } .flf label { display: grid; gap: 6px; } .flf .lbl { margin: 0; } .flf input { width: 100%; font-size: 13px; } .flf button { justify-self: start; }
  .bench .fv { font-size: 7.5px; fill: var(--hot); letter-spacing: .06em; }
  @media (prefers-reduced-motion: reduce) { .slip { transition: none; } .bench .po.fit circle, .bench .cb.pwr.on, .bench .gh, .bench .po.want circle, .bench .cbg, .bench .pt.want .bk, .rite .st.now circle, .rite .ik.beat, .rite .ik.all .tn, .rite .st.seal, .boot li.nw, .bench .leds .la, .bench .cue, #pf button.want { animation: none; } }
</style>
</head>
<body><main>
<section id="gate" hidden>
  <h1>Ghost</h1>
  <form id="gf"><input id="gn" maxlength="40" autocomplete="off" placeholder="ITS NAME" aria-label="The ghost island's name"><button class="on" title="An island with no printer yet: its prints come out here, on this page">START</button></form>
  <p class="say" id="gsay"></p>
  <form id="kf" class="alt"><input id="kk" maxlength="64" autocomplete="off" spellcheck="false" placeholder="KEY" aria-label="An island's key"><button title="Open an island with the key from its welcome slip">OPEN</button></form>
</section>
<div id="twin" hidden>
  <div class="top"><div class="id"><h1 id="nm"></h1><button type="button" class="chip" id="body" aria-pressed="false" title="What prints this island's paper"><i class="led" id="led"></i><span id="bodyw"></span></button></div>
    <div class="row"><button type="button" id="test" title="A test slip, drawn here only">TEST</button><a class="k" href="/#home" title="Back to the home">HOME</a></div></div>
  <svg class="rite" id="rite" viewBox="0 0 320 86" role="group" aria-label="Five stations, lit as the island is made" hidden></svg>
  <div class="stage">
    <svg viewBox="0 0 380 150" aria-hidden="true">
      <defs><linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34332F"/><stop offset=".55" stop-color="#252522"/><stop offset="1" stop-color="#1A1A18"/></linearGradient>
        <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D3C38"/><stop offset="1" stop-color="#2B2A27"/></linearGradient></defs>
      <rect x="18" y="20" width="344" height="118" rx="16" fill="url(#smoke)"/>
      <path d="M34 20h312a16 16 0 0 1 16 16v26H18V36a16 16 0 0 1 16-16z" fill="url(#lid)"/>
      <rect x="18" y="61" width="344" height="1.5" fill="#121211"/>
      <rect x="50" y="128" width="280" height="6" rx="3" fill="#0B0B0A"/>
      <circle id="lamp" cx="322" cy="92" r="4" fill="#4A4843"/>
      <rect x="296" y="104" width="40" height="11" rx="5.5" fill="#1E1E1C" stroke="#3A3935"/>
      <text x="40" y="100" fill="#5E5C56" style="font: 600 9px 'IBM Plex Mono', monospace; letter-spacing: .3em">TWIN</text>
    </svg>
    <div id="roll" aria-live="polite"></div>
    <p class="empty" id="none" hidden title="Prints sent to this island come out here">READY</p>
  </div>
  <div class="parts">
    <details id="bnd" hidden><summary><b>BENCH</b><span id="bns"></span></summary>
      <svg class="bench" id="bnv" viewBox="0 0 320 140" role="group" aria-label="This ghost's parts and the cables between them"></svg>
      <ol class="boot" id="bnlog" hidden title="Its log · tap to skip" aria-live="polite" role="button" tabindex="0" aria-label="Its log: press to skip"></ol>
      <div class="tray" id="bnl" hidden></div>
      <svg class="day" id="bnday" viewBox="0 0 320 46" role="img" aria-label="A day of this island's power: the sun, the battery, the hours asleep" hidden></svg>
      <p class="pw" id="bnp"></p>
      <div id="fl" hidden><span class="lbl" title="Island OS written onto the SD on this bench, as the Raspberry Pi Imager writes it">FLASH</span><div class="opts" id="fls"></div><div id="flp"></div></div>
      <p class="say" id="bnsay"></p><p class="say why" id="bnw" aria-live="polite"></p></details>
    <details id="jd"><summary><b>JOINS</b><span id="js"></span></summary>
      <svg class="map" id="jmap" viewBox="0 0 320 150" role="img" aria-label="This island's joins"></svg>
      <span class="lbl" title="Up to three islands that print what prints here">ECHO</span><div class="opts" id="jto"></div>
      <span class="lbl" title="Where a print here comes out">PAPER</span><div class="opts" id="jmode"><button type="button" data-only="0" title="Here, and at each island above">HERE + THERE</button><button type="button" data-only="1" title="Only at the islands above: the person keeps the story, and this page shows it">ONLY THERE</button></div>
      <span class="lbl" title="An island whose card pictures and picks show here">MIRROR</span><div class="opts" id="jmir"></div>
      <p class="say" id="jsay"></p></details>
    <details id="rd"><summary><b>RADIO</b><span id="rs"></span></summary><ul class="log" id="rlog"></ul></details>
    <details id="bd"><summary><b>BODY</b><span id="bs"></span></summary>
      <div class="opts"><button type="button" id="usb" hidden title="A USB receipt printer beside this screen (Chrome). On Windows it wants the WinUSB driver">USB</button><button type="button" id="ser" hidden title="A serial or Bluetooth receipt printer beside this screen (Chrome)">SERIAL</button></div>
      <form class="row" id="pf" style="margin-top:12px"><input id="pc" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PAIR CODE" aria-label="The pair code your Pi prints"><button title="Your Raspberry Pi prints a pair code when it first starts: this island becomes that printer">ADD</button></form>
      <p class="say" id="bsay"></p></details>
    <details id="kd"><summary><b>KEY</b><span>· · ·</span></summary><div class="opts"><button type="button" id="kcopy" title="Copy this island's key, to open it on another screen">COPY</button><button type="button" id="kout" title="Forget the key on this screen">FORGET</button></div></details>
  </div>
</div>
</main>
<script src="vendor/qrcode.js"></script>
<script src="vendor/rough.js"></script>
<script src="parts.js"></script>
<script src="twin.js"></script>
</body></html>

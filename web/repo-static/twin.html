<title>Twin</title>
<link rel="icon" href="icon.svg">
<style>

  :root { --scrap: #E9E5D8; --pencil: #263652; --bg: #ECEAE2; --ink: #17457F; --grey: #4A6184; --dim: #93A1B6; --line: rgba(23, 69, 127, .17); --grid: rgba(23, 69, 127, .055); --paper: #FAF9F4; --hot: #D4461E; --body: #E3E0D6;

  #roll.all .slip { max-height: none; opacity: 1; margin-top: 10px; } #roll.all .slip:first-child { margin-top: 0; } #roll.all .slip:nth-child(n+6) { display: block; } #roll.all .slip:not(:first-child)::after { display: block; }

  .bench .air.tx path { animation-duration: .7s; } @keyframes air { 20% { opacity: .9; } to { opacity: 0; } }

  #gate .alt { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
  /* the bench: each part drawn by hand, its ports below it; tap a port, then another, for a cable */

  .bench .pt { color: var(--ink); transition: opacity .3s; } .bench .pt.off > g:not(.po) { opacity: .55; }
  .bench .pt > .bk { fill: #1C1C1A; stroke: rgba(236, 234, 228, .2); stroke-width: 1; } .bench .pt > .sh { fill: #000; opacity: .5; }

  .bench .bolt { fill: var(--ink); stroke: none; opacity: .75; } .bench .bolt.no { fill: none; stroke: var(--grey); stroke-width: 1.1; opacity: 1; } .bench.pw-on .bolt.no { stroke: var(--hot); }
  .bench .pl { font-size: 7.5px; fill: var(--grey); letter-spacing: .06em; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .bench .po { cursor: pointer; outline: none; } .bench .po circle { fill: var(--bg); stroke: var(--ink); stroke-width: 1.3; } .bench .po circle.ph { fill: transparent !important; stroke: none !important; }
  .bench .po.fit circle:not(.ph) { stroke: var(--hot); stroke-width: 2; stroke-dasharray: 2 2; animation: fit 1.2s ease-in-out infinite alternate; } @keyframes fit { to { stroke-dashoffset: 4; } }
  .bench .po:hover circle, .bench .po:focus-visible circle { stroke: var(--hot); } .bench .po.sel circle { fill: var(--hot); stroke: var(--hot); } .bench .po.used circle { fill: var(--ink); }
  .bench .cb { stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; } .bench .cb.bad { stroke: var(--hot); opacity: .45; stroke-dasharray: 2 4; }
  .bench .cb.dat { stroke-width: 1.1; } .bench .cb.pwr { stroke: var(--dim); } .bench .cb.pwr.on { stroke: var(--ink); stroke-dasharray: 5 4; animation: flow .9s linear infinite; } @keyframes flow { to { stroke-dashoffset: -9; } }
  .bench .sdf { fill: var(--hot); opacity: .55; } .bench .sdf.v { opacity: 1; }

  .bench .hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
  .why { color: var(--ink); margin-top: 6px; letter-spacing: .04em; line-height: 1.5; } .why:empty { display: none; }
  /* the build: what the island wants next is drawn where it goes. A ghost of the part, or two ports breathing and a dotted cable */

  .bench .gh .pen { opacity: .5; } .bench .gh .sk { opacity: .82; } .bench .gh .ac { color: var(--pencil); }
  .bench .gh:hover .bk, .bench .gh:focus-visible .bk { fill: #F1EEE6; }

  .bench .tp { fill: rgba(236, 234, 228, .16); } .bench .gh .tp { fill: rgba(196, 190, 176, .62); }
  /* placed: loose, joined, alive. Loose is faint; joined is taped down; alive is stamped, its own colour lit */

  .bench .pt.l2 > .bk { stroke: rgba(236, 234, 228, .3); } .bench .pt.l2 .ac { filter: drop-shadow(0 0 2px rgba(226, 85, 46, .6)); }
  .bench .stmp { fill: none; stroke: var(--grey); stroke-width: .9; } .bench .stmp circle { stroke-dasharray: .1 2.1; stroke-width: 1.4; stroke-linecap: round; }
  .bench .po { touch-action: none; } .bench .po.want circle:not(.ph) { stroke: var(--hot); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: want .9s ease-in-out infinite alternate; } @keyframes want { to { transform: scale(1.45); } }
  .bench .cbg { stroke: var(--hot); stroke-width: 1.5; stroke-dasharray: 1 6; stroke-linecap: round; animation: flow 1.4s linear infinite; }
  .bench .cbd { stroke: var(--hot); stroke-width: 1.8; fill: none; pointer-events: none; }
  .bench [data-body] { cursor: pointer; outline: none; } .bench [data-body]:focus-visible .bk { stroke: var(--hot); }
  .bench .pt.want > .bk { stroke: var(--hot); stroke-width: 1.8; animation: pulse 1.3s ease-in-out infinite alternate; } @keyframes pulse { to { stroke-opacity: .25; } }
  .bench .roll .rl0 { fill: none; stroke: var(--line); } .bench .roll .rl { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; transition: r .6s; } .bench .roll .rl.low { stroke: var(--hot); } .bench .roll .rc { fill: var(--ink); }
  .tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; margin: 2px 0 12px; } .tray[hidden] { display: none; } .tray:not(.swap) .th { display: none; }
  .tile { background: var(--scrap); color: var(--pencil); border: 0; border-radius: 2px; box-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 8px 14px rgba(0, 0, 0, .35); transform: rotate(-1.2deg); }
  .tile:nth-child(odd) { transform: rotate(1.1deg); } .tile:hover { border-color: transparent; transform: rotate(0) translateY(-2px); }
  .tile b { font: 400 13px/1.1 Hand, cursive; letter-spacing: 0; text-transform: lowercase; } .tile span { color: #6E6B63; } .tile svg { color: var(--pencil); filter: url(#wob); } .tile svg .ac { stroke: var(--pencil); }
  .tile { display: grid; justify-items: center; align-content: start; gap: 3px; padding: 8px 4px 8px; border-radius: 12px; font: 600 8.5px/1.25 'IBM Plex Mono', monospace; letter-spacing: .1em; min-height: 0; }
  .tile span { font-size: 6.5px; letter-spacing: .14em; color: var(--grey); text-align: center; } .tile b { font-size: 9px; } .tray .th { grid-column: 1 / -1; margin: 0; font: 700 11px Poppins, sans-serif; letter-spacing: .12em; color: var(--grey); }
  .tile svg { width: 100%; max-width: 72px; height: auto; aspect-ratio: 4 / 3; color: var(--ink); } .tile svg path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; } .tile svg .ac { stroke: var(--hot); }
  .tile i { font-style: normal; font-size: 7px; color: var(--hot); letter-spacing: .16em; } .tile.on { background: var(--scrap); color: var(--pencil); box-shadow: 0 0 0 2px var(--hot), 0 8px 14px rgba(0, 0, 0, .35); } .tile.x { font: 400 24px/1 Hand, cursive; color: var(--pencil); align-content: center; }
  .day { display: block; width: 100%; height: auto; margin: 0 0 8px; } .day[hidden] { display: none; }
  .day .sun { fill: none; stroke: var(--hot); stroke-width: 1.4; } .day .lv { fill: var(--ink); fill-opacity: .12; stroke: var(--ink); stroke-width: 1; } .day .nt { fill: var(--ink); opacity: .1; } .day .dk { stroke: var(--ink); stroke-width: 1.4; }
  /* the stages: five, in a line; done is filled, now is the hot ring, to come is a faint ring */
  .top .chip { border: 0; padding: 0; min-height: 0; background: none; color: var(--grey); } .top .chip:disabled { opacity: 1; cursor: default; } .top .chip.off .led { background: transparent; box-shadow: inset 0 0 0 1.4px var(--hot); }
  .rite { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
  .rite .st { position: relative; display: grid; justify-items: center; }

  .rite .st.lit + .st::before { background: var(--ink); opacity: .55; }

  .rite button:focus-visible i { outline: 2px solid var(--ink); outline-offset: 3px; }
  .rite i { width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--dim); background: var(--bg); display: grid; place-items: center; transition: background .4s, border-color .4s; }
  .rite b { font: 600 8.5px/1 'IBM Plex Mono', monospace; letter-spacing: .18em; color: var(--dim); }
  .rite .lit i { background: var(--ink); border-color: var(--ink); } .rite .lit i::after { content: ''; width: 7px; height: 4px; border: solid var(--bg); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .rite .lit b { color: var(--grey); }

  /* the build: a cutting mat, the parts on it, and the dock that says what is next */
  .build { position: relative; margin: 16px -16px 0; padding: 14px 16px 0; background: radial-gradient(rgba(236, 234, 228, .075) 1px, transparent 1.3px) 0 0 / 16px 16px; border-top: 1px solid var(--line); }
  .build[hidden] { display: none; }
  .isle { display: block; width: 100%; height: auto; margin: 12px 0 0; color: var(--grey); overflow: visible; } .isle[hidden] { display: none; }
  .isle path { fill: none; } .isle .sea { opacity: .55; } .isle .junk { color: var(--dim); } .isle .relic, .isle .live { color: var(--ink); } .isle .murk { color: #5A5446; }
  .isle .sun { fill: none; stroke: var(--hot); stroke-width: 1.4; stroke-dasharray: .1 3.2; stroke-linecap: round; } .isle .flag { fill: var(--paper); } .isle .lamp { fill: var(--hot); filter: drop-shadow(0 0 4px var(--hot)); animation: dot 2.6s ease-in-out infinite; }
  .isle .tie { fill: none; stroke: var(--grey); stroke-width: .8; stroke-dasharray: 1 4; stroke-linecap: round; } .isle .jl { color: var(--ink); opacity: .85; animation: bob 7s ease-in-out infinite alternate; } @keyframes bob { to { transform: translate(14px, -3px); } }

  #gate .isle { margin: 0 0 -6px; }

  .isle .hub text { font: 400 11.5px Hand, cursive; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .isle .go { cursor: pointer; outline: none; } .isle .go .hot { fill: transparent; } .isle .go:hover text, .isle .go:focus-visible text { fill: var(--hot); }
  .isle .go:focus-visible .hot { stroke: var(--hot); stroke-width: .8; stroke-dasharray: 2 2; }

  .tray .tile svg { color: var(--pencil); } .tray .tile svg path { stroke-width: 1.7; } .tray .tile svg .ac { stroke: var(--hot); }
  .fold { position: relative; width: 88%; margin: 4px auto 0; padding: 16px 10px 12px; background: #262522; border-radius: 0 6px 6px 6px; box-shadow: inset 0 0 0 1px rgba(236, 234, 228, .05), 0 14px 26px rgba(0, 0, 0, .45); }
  .fold::before { content: ''; position: absolute; left: 0; top: -13px; width: 40%; height: 14px; background: inherit; border-radius: 6px 12px 0 0; }
  .fold::after { content: ''; position: absolute; right: 22px; top: -9px; width: 9px; height: 30px; border: 1.5px solid #8C8980; border-radius: 6px; transform: rotate(7deg); z-index: 3; }
  .fold .ft { position: absolute; left: 12px; top: -11px; font: 400 13px/1 Hand, cursive; color: var(--grey); }
  .fold #roll { width: 100%; margin: 0; }

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RESEARCH BOARD · novel.global</title>
<link rel="icon" href="icon.svg">
<style>
  @font-face { font-family: 'Archivo Narrow'; src: url('vendor/archivo-narrow.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Departure Mono'; src: url('vendor/departure-mono.woff2') format('woff2'); font-display: swap; }
  :root { --paper: #ECEBE7; --ink: #0B0B0B; --blue: #143D71; --own: #D9F24A; --dot: rgba(11, 11, 11, .3); --bar: #0B0B0B; --barink: #ECEBE7; }
  html.night { --paper: #121314; --ink: #F1F0EC; --dot: rgba(241, 240, 236, .22); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { font: 600 14px/1 'Archivo Narrow', Arial, sans-serif; }
  #wrap { position: fixed; inset: 0 0 calc(50px + env(safe-area-inset-bottom)) 0; background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.6px); background-size: 22px 22px; touch-action: none; }
  #top { position: fixed; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 10px); display: flex; gap: 6px; align-items: center; pointer-events: none; z-index: 2; }
  #top > * { pointer-events: auto; }
  #bname { border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 5px 10px; font: 600 12px/1 'Archivo Narrow', Arial, sans-serif; letter-spacing: .06em; cursor: pointer; }
  #home { font: 400 12px/1 'Departure Mono', ui-monospace, monospace; color: var(--ink); text-decoration: none; margin-right: auto; }
  html.in #home { visibility: hidden; }
  #saved { margin-left: auto; font: 400 11px/1 'Departure Mono', ui-monospace, monospace; letter-spacing: .1em; opacity: .55; }
  nav#tools { position: fixed; left: 0; right: 0; bottom: 0; height: calc(50px + env(safe-area-inset-bottom)); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); display: flex; gap: 2px; background: var(--bar); color: var(--barink); overflow-x: auto; scrollbar-width: none; z-index: 3; }
  nav#tools::-webkit-scrollbar { display: none; }
  nav#tools button { flex: 0 0 auto; width: 40px; display: grid; grid-template-rows: 1fr auto; place-items: center; gap: 2px; border: 0; border-radius: 8px; background: transparent; color: inherit; cursor: pointer; padding: 5px 0 4px; }
  nav#tools button span { font: 400 7px/1 'Departure Mono', ui-monospace, monospace; letter-spacing: .06em; opacity: .8; }
  nav#tools svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav#tools .f { fill: currentColor; stroke: none; }
  nav#tools button[aria-pressed="true"] { background: var(--own); color: #0B0B0B; }
  nav#tools button:disabled { opacity: .28; cursor: default; }
  nav#tools button[hidden] { display: none; }
  nav#tools .sep { flex: 0 0 1px; margin: 8px 3px; background: currentColor; opacity: .25; }
  #menu { position: fixed; left: 10px; top: calc(env(safe-area-inset-top) + 50px); z-index: 4; min-width: 200px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 4px; display: grid; }
  #menu[hidden] { display: none; }
  #menu button { text-align: left; border: 0; background: none; color: inherit; padding: 10px 10px; font: 600 15px/1 'Archivo Narrow', Arial, sans-serif; letter-spacing: .04em; border-radius: 5px; cursor: pointer; }
  #menu button.on { background: var(--ink); color: var(--paper); }
  #menu hr { border: 0; border-top: 1px solid var(--ink); opacity: .25; margin: 4px 6px; }
  #pr { position: fixed; right: 10px; bottom: calc(58px + env(safe-area-inset-bottom)); z-index: 4; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 10px; display: grid; gap: 8px; width: min(280px, calc(100vw - 20px)); }
  #pr[hidden] { display: none; }
  #kits { position: fixed; left: 10px; bottom: calc(58px + env(safe-area-inset-bottom)); z-index: 4; width: min(320px, calc(100vw - 20px)); background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #kits[hidden] { display: none; }
  #kits button { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 8px; min-height: 48px; text-align: left; border: 1.5px solid var(--ink); border-radius: 7px; background: none; color: inherit; padding: 6px 8px; font: 600 14px/1 'Archivo Narrow', Arial, sans-serif; letter-spacing: .04em; cursor: pointer; }
  #kits button:hover, #kits button:focus-visible { background: var(--ink); color: var(--paper); }
  #kits svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #kits .f { fill: currentColor; stroke: none; }
  #kits small { display: block; margin-top: 3px; font: 400 9px/1.2 'Departure Mono', ui-monospace, monospace; letter-spacing: .04em; opacity: .7; }
  #pr select, #pr button { height: 34px; border-radius: 17px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 600 15px/1 'Archivo Narrow', Arial, sans-serif; letter-spacing: .04em; padding: 0 12px; }
  #pr .go { background: var(--ink); color: var(--paper); cursor: pointer; }
  #pr .row { display: flex; gap: 8px; align-items: center; }
  #pr .row > * { flex: 1; }
  #prst { flex: 0 0 auto !important; font: 14px/1 ui-monospace, monospace; }
  @font-face { font-family: 'Architects Daughter'; src: url('vendor/architects-daughter.woff2') format('woff2'); font-display: swap; }
  #guide { position: fixed; inset: 0; z-index: 9; background: rgba(236, 235, 231, .78); cursor: pointer; }
  html.night #guide { background: rgba(18, 19, 20, .8); }
  #guide svg { position: absolute; inset: 0; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #guide p { position: absolute; left: 24px; right: 24px; margin: 0; text-align: center; font: 400 26px/1.15 'Architects Daughter', 'Comic Sans MS', cursive; color: var(--ink); transform: rotate(-1.5deg); }
  #guide b { position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + 14px); font: 400 11px/1 'Departure Mono', monospace; color: var(--ink); opacity: .6; }
  #drop { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(217, 242, 74, .35); border: 4px dashed var(--ink); font: 600 40px/1 'Archivo Narrow', Arial, sans-serif; }
  html.dragging #drop { display: grid; }
  #peek { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 88%, transparent); cursor: pointer; transition: opacity .5s, transform .5s; }
  #peek.out { opacity: 0; transform: scale(.82); }
  #peek svg { width: min(92vw, 560px); height: auto; overflow: visible; }
  #peek .b { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pk-in .34s cubic-bezier(.3, 1.6, .5, 1) calc(var(--i) * .16s + .1s) forwards; }
  #peek .sq, #peek .ln, #peek .w path, #peek .pen { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #peek .sq { stroke-width: 2; }
  #peek .ln, #peek .pen { stroke: var(--ink); }
  #peek .w path { stroke: var(--ink); stroke-dasharray: 4 5; opacity: 0; animation: pk-fade .4s 1.05s forwards; }
  #peek .pen { stroke-dasharray: 260; stroke-dashoffset: 260; animation: pk-pen .9s 1.2s ease-out forwards; }
  @keyframes pk-in { from { opacity: 0; transform: scale(.6) rotate(-4deg); } to { opacity: 1; transform: none; } }
  @keyframes pk-fade { to { opacity: .7; } }
  @keyframes pk-pen { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="top"><a id="home" href="/">novel.global</a><button type="button" id="bname">BOARD 01</button><span id="saved"></span></div>
<div id="menu" hidden></div>
<div id="pr" hidden><select id="prto" aria-label="Printer"></select><div class="row"><button type="button" class="go" id="prgo">PRINT</button><span id="prst"></span></div><button type="button" id="prpng">SAVE PICTURE</button></div>
<div id="kits" hidden>
  <button type="button" data-k="shuffle"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5" class="f"/><circle cx="16" cy="16" r="1.5" class="f"/><circle cx="12" cy="12" r="1.5" class="f"/></svg><span>SHUFFLE<small>one card drawn at random</small></span></button>
  <button type="button" data-k="deck"><svg viewBox="0 0 24 24"><path d="M5 7l9-3 4 13-9 3z"/><path d="M9 4.7L11 4"/></svg><span>STRATEGIES<small>five sideways moves</small></span></button>
  <button type="button" data-k="photos"><svg viewBox="0 0 24 24"><path d="M3 6h13v11H3z"/><path d="M8 3h13v11"/><path d="M3 14l4-4 3 3 2-2 4 4"/></svg><span>PHOTOS<small>four found pictures</small></span></button>
  <button type="button" data-k="notes"><svg viewBox="0 0 24 24"><path d="M3 4h8v8H3z" class="f"/><path d="M13 8h8v8h-8zM6 14h8v7H6z"/></svg><span>NOTES<small>three questions to start</small></span></button>
  <button type="button" data-k="steps"><svg viewBox="0 0 24 24"><path d="M3 5h5M10 5h4M16 5h5M3 9v10M10 9v10M16 9v10"/></svg><span>THREE STEPS<small>noticed, response, action</small></span></button>
  <button type="button" data-k="form"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>W.I.S.H. POEM<small>the poem as the ground</small></span></button>
</div>
<div id="drop">DROP</div>
<nav id="tools">
  <button type="button" data-t="kits" aria-label="Quick starts" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" class="f"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M17.25 13.5v7.5M13.5 17.25H21"/></svg><span>START</span></button>
  <i class="sep"></i>
  <button type="button" data-t="note" aria-label="Note"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z" class="f"/></svg><span>NOTE</span></button>
  <button type="button" data-t="sect" aria-label="Section"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/></svg><span>SECT</span></button>
  <button type="button" data-t="dot" aria-label="Dot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" class="f"/></svg><span>DOT</span></button>
  <button type="button" data-t="link" aria-label="Link" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="2.6" class="f"/><circle cx="19" cy="5" r="2.6" class="f"/></svg><span>LINK</span></button>
  <button type="button" data-t="pencil" aria-label="Pencil" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg><span>PENCIL</span></button>
  <button type="button" data-t="img" aria-label="Picture"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 16l5-5 4 4 2-2 5 5"/><circle cx="16" cy="9" r="1.6" class="f"/></svg><span>IMG</span></button>
  <button type="button" data-t="paste" aria-label="Paste"><svg viewBox="0 0 24 24"><path d="M8 4h8v3H8z"/><path d="M6 6H5v15h14V6h-1"/></svg><span>PASTE</span></button>
  <i class="sep"></i>
  <button type="button" data-t="colour" aria-label="Colour" disabled><svg viewBox="0 0 24 24"><path d="M4 4h8v16H4z" class="f"/><path d="M12 4h8v16h-8z"/></svg><span>COLOUR</span></button>
  <button type="button" data-t="front" aria-label="To the front" disabled><svg viewBox="0 0 24 24"><path d="M8 8h12v12H8z" class="f"/><path d="M4 4h12v3M4 4v12h3"/></svg><span>FRONT</span></button>
  <button type="button" data-t="del" aria-label="Remove" disabled><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>DEL</span></button>
  <button type="button" data-t="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg><span>UNDO</span></button>
  <i class="sep"></i>
  <button type="button" data-t="lock" aria-label="Lock" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 11h12v9H6z"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>LOCK</span></button>
  <button type="button" data-t="fit" aria-label="Fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>FIT</span></button>
  <button type="button" data-t="form" aria-label="W.I.S.H." aria-pressed="true" hidden><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>POEM</span></button>
  <button type="button" data-t="out" aria-label="Out"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><path d="M4 9h16v8H4z"/><path d="M7 14h10v7H7z"/></svg><span>OUT</span></button>
</nav>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script src="vendor/fabric.min.js"></script>
<script src="research.js"></script>
</body></html>

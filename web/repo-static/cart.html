<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>novel.global</title>
<style>
  @font-face { font-family: 'VT323'; font-weight: 400; src: url(vendor/fonts/vt323-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url(vendor/fonts/poppins-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url(vendor/fonts/poppins-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(vendor/fonts/poppins-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(vendor/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(vendor/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }
  :root { --ink: #111; --paper: #f2f1ec; --line: #111; --dim: rgba(17, 17, 17, .45); --on: #2fbf55; --bg: #d9d8d2; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --paper: #161718; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); --bg: #0c0d0e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 500 12px/1.2 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .win { background: var(--paper); border: 1px solid var(--line); }
  .win > header { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--ink); color: var(--paper); }
  .win > header b { font-weight: 700; flex: 1; }
  .led { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; display: inline-block; flex: none; }
  .led.on { background: var(--on); border-color: var(--on); }
  .desk { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; justify-content: center; align-items: flex-start; }
  #paper { width: min(100%, 512px); min-height: 60vh; background: #f6f5f1; padding: 14px 0 22px; box-shadow: 0 1px 0 rgba(0, 0, 0, .08), 0 10px 26px -14px rgba(0, 0, 0, .45); }
  #paper.has { min-height: 0; }
  #paper canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; filter: contrast(.86); }
  .side { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 240px; position: sticky; top: 16px; }
  button { font: inherit; letter-spacing: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; min-height: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .35; cursor: default; }
  #to, #opts { display: flex; gap: 8px; flex-wrap: wrap; }
  #opts button { flex: 1 1 auto; min-height: 36px; padding: 8px 10px; font-size: 11px; }
  #opts select { flex: 1 1 100%; min-height: 36px; padding: 8px 10px; font: inherit; font-size: 11px; letter-spacing: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; text-transform: uppercase; }
  #to:empty, #opts:empty, #pick:empty { display: none; }
  #pick { flex: 1 1 100%; display: flex; justify-content: center; }
  #pick select { width: min(100%, 768px); min-height: 44px; padding: 10px 12px; font: inherit; font-size: 12px; letter-spacing: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 0; text-transform: uppercase; }
  @media (max-width: 600px) { #pick { padding: 0 12px; } }
  #go { min-height: 56px; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--paper); }
  #st { min-height: 1.2em; margin: 0; color: var(--dim); text-align: center; }
  @media (max-width: 600px) { .side { max-width: none; position: static; } .desk { padding: 12px 0; } }
  .in { --ink: #111; --paper: #f2f1ec; --line: #111; --dim: rgba(17, 17, 17, .45); --bg: transparent; }
  .in.dk { --ink: #ecebe6; --paper: #121417; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); }
  .in body { background: transparent; } .in main { padding: 0; } .in .win { border: 0; background: transparent; } .in .win > header { display: none; }
  /* the quick face: the paper, one more, print */
  html.qk #pick, html.qk #to, html.qk #opts button:not([data-a="again"]), html.qk #opts select { display: none; }
  @media (max-width: 760px) { html.qk .side { max-width: none; top: auto; } }
  html.qk .side { position: sticky; bottom: 0; z-index: 3; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); background: var(--paper); }
  html.qk #go { min-height: 64px; font-size: 17px; letter-spacing: .14em; }
</style>
<script src="vendor/qrcode.js"></script>
<script src="cart.js"></script></head>
<body><main><section class="win" id="cart" aria-live="polite"><header><i class="led" id="led"></i><b id="nm">·</b></header>
<div class="desk"><div id="pick"></div><div id="paper"><canvas aria-label="The slip"></canvas></div>
<div class="side"><div id="opts"></div><div id="to"></div><button type="button" id="go" disabled>PRINT</button><p id="st">· · ·</p></div></div></section></main></body></html>

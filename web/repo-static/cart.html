<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>novel.global</title>
<style>
  @font-face { font-family: 'VT323'; font-weight: 400; src: url(vendor/fonts/vt323-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url(vendor/fonts/poppins-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url(vendor/fonts/poppins-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(vendor/fonts/poppins-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(vendor/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; src: url(vendor/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }
  :root { --ink: #111; --paper: #f2f1ec; --line: #111; --dim: rgba(17, 17, 17, .45); --on: #2fbf55; --bg: #d9d8d2; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --paper: #161718; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); --bg: #0c0d0e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 500 12px/1.2 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .win { background: var(--paper); border: 1px solid var(--line); }
  .win > header { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--ink); color: var(--paper); }
  .win > header b { font-weight: 700; flex: 1; }
  .led { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; display: inline-block; flex: none; }
  .led.on { background: var(--on); border-color: var(--on); }
  .desk { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; justify-content: center; align-items: flex-start; }
  #paper { width: min(100%, 512px); min-height: 60vh; background: #f6f5f1; padding: 14px 0 22px; box-shadow: 0 1px 0 rgba(0, 0, 0, .08), 0 10px 26px -14px rgba(0, 0, 0, .45); }
  #paper.has { min-height: 0; }
  #paper canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; filter: contrast(.86); }
  .side { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 240px; position: sticky; top: 16px; }
  button { font: inherit; letter-spacing: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; min-height: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .35; cursor: default; }
  #to, #opts { display: flex; gap: 8px; flex-wrap: wrap; }
  #opts button { flex: 1 1 auto; min-height: 36px; padding: 8px 10px; font-size: 11px; }
  #opts select { flex: 1 1 100%; min-height: 36px; padding: 8px 10px; font: inherit; font-size: 11px; letter-spacing: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; text-transform: uppercase; }
  #to:empty, #opts:empty, #pick:empty { display: none; }
  #pick { flex: 1 1 100%; display: flex; justify-content: center; }
  #pick select { width: min(100%, 768px); min-height: 44px; padding: 10px 12px; font: inherit; font-size: 12px; letter-spacing: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 0; text-transform: uppercase; }
  #pick { flex-wrap: wrap; gap: 8px; } #pick select { flex: 1 1 260px; max-width: 600px; } #pick select[data-a="go"] { flex: 0 1 170px; }
  @media (max-width: 600px) { #pick { padding: 0 12px; } }
  #go { min-height: 56px; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--paper); }
  #st { min-height: 1.2em; margin: 0; color: var(--dim); text-align: center; }
  /* ART: a green key with a pointing hand, the same wherever art can be changed; while on, the places art can go are marked on the paper */
  #paper { position: relative; }
  #opts button[data-a="art"] { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 0 0 auto; order: 9; margin-left: auto; background: #1D9A55; border-color: #1D9A55; color: #fff; border-radius: 18px; }
  #opts button[data-a="deck"], #opts button[data-a="biz"] { flex: 1 1 0; width: auto; }
  /* the book: adding one's own stands on its own line, plain to see */
  #opts button[data-a="add"] { flex: 1 1 100%; font-weight: 600; }
  /* on the cards, ART stands in the row as a third key of the same shape */
  #opts:has(button[data-a="deck"]) button[data-a="art"] { flex: 1 1 0; order: 0; margin-left: 0; border-radius: 0; }
  #opts button[data-a="biz"] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  /* MIXTAPE: the round key on the cover plays it all; a track tapped plays from there (▶ under its number); ↗ the radar where it was made */
  #tpov { position: absolute; z-index: 2; }
  #tpov button { position: absolute; min-height: 0; padding: 0; border: 0; background: none; color: #111; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #tpov button:hover { background: rgba(0, 0, 0, .04); } #tpov button.on { background: rgba(232, 145, 58, .16); box-shadow: inset 4px 0 0 #E8913A; }
  #tpov .tp-at { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid #E8913A; pointer-events: none; animation: tpat 1.6s ease-out infinite; }
  @keyframes tpat { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #tpov .tp-at { animation: none; } }
  #tpov button:focus-visible { outline: 2px solid #1D9A55; outline-offset: -2px; }
  #tpov button[data-i]::after { content: '\25B6'; position: absolute; left: 9px; bottom: 14px; font: 400 11px/1 sans-serif; opacity: .3; }
  #tpov button[data-i].on::after { content: '\275A\275A'; letter-spacing: -1px; color: #E8913A; opacity: 1; }
  #tpov .tp-go { display: grid; place-items: center; border-radius: 50%; background: #F4F1E8; color: #111; box-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
  #tpov .tp-go:hover { background: #fff; } #tpov .tp-go[aria-pressed="true"] { background: #E8913A; }
  #tpov .tp-go svg { width: 24px; height: 24px; }
  #spq { flex: 1 1 100%; max-width: 512px; margin: 0 auto 4px; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 0; }
  /* SPECIES LIST: taps laid over the paper's rows; a tick and a line through for what is spotted, × to take a species off */
  #spov { position: absolute; z-index: 2; } #spov[hidden] { display: none; }
  #spov button, #spov a { position: absolute; min-height: 0; padding: 0; border: 0; background: none; color: #111; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #spov button:focus-visible { outline: 2px solid #1D9A55; outline-offset: -2px; }
  #spov .sp-k.on::after { content: ''; position: absolute; left: 22%; top: 10px; width: 30%; height: 15%; min-height: 8px; border: solid #111; border-width: 0 0 4px 4px; transform: rotate(-45deg); }
  #spov .sp-o.on::after { content: ''; position: absolute; left: 4px; top: 34%; width: var(--w); max-width: 100%; height: 2px; background: #111; }
  #spov .sp-x { display: grid; place-items: start center; padding-top: 6px; font: 400 18px/1 sans-serif; opacity: .35; } #spov .sp-x:hover, #spov .sp-x:focus-visible { opacity: 1; }
  #spov .sp-o:hover, #spov .sp-a:hover { background: rgba(0, 0, 0, .04); }
  #spov .sp-l { font: 600 11px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; padding: 6px 4px; background: #f6f5f1; text-decoration: underline; }
  #bizf { flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px; max-width: 512px; margin: 0 auto 10px; } #bizf[hidden] { display: none; }
  #bizf input { min-height: 40px; padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 0; }
  #opts button[data-a="art"][aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .ptr { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #artov { position: absolute; z-index: 2; pointer-events: none; }
  #artov button { position: absolute; min-height: 0; padding: 0; border: 2px dashed #1D9A55; border-radius: 6px; background: rgba(29, 154, 85, .12); pointer-events: auto; animation: art-p 1.8s ease-in-out infinite; }
  #artov button i { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; display: grid; place-items: center; background: #1D9A55; color: #fff; font: 600 20px/1 sans-serif; font-style: normal; box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .5); }
  #artov button i .ptr { width: 20px; height: 20px; }
  #artov button.has { border-style: solid; background: none; animation: none; } #artov button.has i { width: 30px; height: 30px; margin: -15px 0 0 -15px; background: #111; }
  @keyframes art-p { 50% { background-color: rgba(29, 154, 85, .26); } }
  @media (prefers-reduced-motion: reduce) { #artov button { animation: none; } }
  @media (max-width: 600px) { .side { max-width: none; position: static; padding: 0 12px; } .desk { padding: 12px 0; } }
  /* a book's page is long: on a phone its choices and PRINT stand above it, not at its end */
  @media (max-width: 760px) { html[data-kind="book"] .side { order: -1; max-width: none; position: static; } html[data-kind="book"] #pick { order: -2; } }
  .in { --ink: #111; --paper: #f2f1ec; --line: #111; --dim: rgba(17, 17, 17, .45); --bg: transparent; }
  .in.dk { --ink: #ecebe6; --paper: #121417; --line: #ecebe6; --dim: rgba(236, 235, 230, .45); }
  .in body { background: transparent; } .in main { padding: 0; } .in .win { border: 0; background: transparent; } .in .win > header { display: none; }
  /* the quick face: the paper, one more, print */
  html.qk #pick, html.qk #to, html.qk #opts button:not([data-a="again"]), html.qk #opts select { display: none; }
  @media (max-width: 760px) { html.qk .side { max-width: none; top: auto; } }
  html.qk .side { position: sticky; bottom: 0; z-index: 3; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); background: var(--paper); }
  html.qk #go { min-height: 64px; font-size: 17px; letter-spacing: .14em; }
</style>
<script src="vendor/qrcode.js"></script>
<script src="spot.js"></script>
<script src="away.js"></script>
<script src="cart.js"></script></head>
<body><main><section class="win" id="cart" aria-live="polite"><header><i class="led" id="led"></i><b id="nm">·</b></header>
<div class="desk"><div id="pick"></div><div id="paper"><canvas aria-label="The slip"></canvas></div>
<div class="side"><div id="opts"></div><div id="to"></div><button type="button" id="go" disabled>PRINT</button><p id="st">· · ·</p></div></div></section></main></body></html>
